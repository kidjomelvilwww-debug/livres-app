<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Détails du livre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="bi bi-book-half"></i> Ma Bibliothèque
        </a>
        <a href="index.html" class="btn btn-light btn-sm">
            <i class="bi bi-arrow-left"></i> Retour
        </a>
    </div>
</nav>

<div class="container">
    <div id="content" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) {
        document.getElementById('content').innerHTML =
            '<div class="alert alert-danger">Aucun ID de livre fourni</div>';
        return;
    }

    try {
        const r = await fetch(`api/livres/${id}`);
        if (!r.ok) throw new Error('Livre introuvable');
        const livre = await r.json();

        const img = livre.imageUrl || 'https://via.placeholder.com/300x400?text=Livre';
        const titreJs = (livre.titre || '').replace(/'/g, "\\'").replace(/"/g, '\\"');

        // Construire les boutons
        const btns = [];

        if (livre.fichierUrl) {
            btns.push(`<a href="${livre.fichierUrl}" target="_blank" class="btn btn-primary">
                        <i class="bi bi-download"></i> Télécharger
                       </a>`);
        } else {
            btns.push(`<button class="btn btn-primary" disabled title="Pas de fichier disponible">
                        <i class="bi bi-download"></i> Télécharger
                       </button>`);
        }

        const amazonUrl = 'https://www.amazon.fr/s?k=' +
            encodeURIComponent((livre.titre || '') + ' ' + (livre.auteur || ''));
        btns.push(`<a href="${amazonUrl}" target="_blank" class="btn btn-success">
                    <i class="bi bi-cart"></i> Amazon
                   </a>`);

        btns.push(`<button class="btn btn-warning" onclick="commander('${titreJs}')">
                    <i class="bi bi-bag-check"></i> Commander
                   </button>`);

        document.getElementById('content').innerHTML = `
            <div class="row justify-content-center">
                <div class="col-md-4 text-center mb-4">
                    <img src="${img}" class="img-fluid rounded shadow"
                         onerror="this.src='https://via.placeholder.com/300x400?text=Livre'">
                </div>
                <div class="col-md-8 text-start">
                    <span class="badge bg-success mb-2">
                        <i class="bi bi-database"></i> Ma bibliothèque
                    </span>
                    <h2>${livre.titre}</h2>
                    <p class="lead text-muted">par ${livre.auteur || 'Auteur inconnu'}</p>
                    <hr>
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong><i class="bi bi-calendar"></i> Année :</strong> ${livre.annee || '—'}</p>
                            <p><strong><i class="bi bi-tag"></i> Domaine :</strong> ${livre.domaine || '—'}</p>
                            <p><strong><i class="bi bi-building"></i> Éditeur :</strong> ${livre.editeur || '—'}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong><i class="bi bi-upc"></i> ISBN :</strong> ${livre.isbn || '—'}</p>
                        </div>
                    </div>
                    <hr>
                    <h5>Description</h5>
                    <p class="text-muted">${livre.description || 'Pas de description disponible.'}</p>
                    <hr>
                    <div class="d-flex flex-wrap gap-2 mt-4">
                        ${btns.join('')}
                    </div>
                </div>
            </div>
        `;
    } catch (e) {
        document.getElementById('content').innerHTML =
            '<div class="alert alert-danger">Erreur : ' + e.message + '</div>';
    }
});

async function commander(titre) {
    const email = prompt('Votre email pour commander "' + titre + '" :');
    if (!email || email.trim() === '') return;

    try {
        const r = await fetch('api/commande', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim(), titre: titre, source: 'LOCAL' })
        });

        if (r.ok) {
            alert('✅ Commande enregistrée !\nUn email de confirmation sera envoyé à ' + email);
        } else {
            const data = await r.json();
            alert('❌ Erreur : ' + (data.error || 'Erreur inconnue'));
        }
    } catch (e) {
        alert('❌ Erreur réseau : ' + e.message);
    }
}
</script>
</body>
</html>
