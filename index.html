<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>📚 Recherche de Livres</title>

    <!-- Bootstrap (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS perso -->
    <link href="/style.css" rel="stylesheet">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-book-half"></i> Ma Bibliothèque
        </a>
        <div class="ms-auto">
            <a href="login.html" class="btn btn-light btn-sm">
                <i class="bi bi-person-lock"></i> Admin
            </a>
        </div>
    </div>
</nav>

<!-- ============ HERO + RECHERCHE ============ -->
<div class="bg-light py-5 mb-4">
    <div class="container">
        <h1 class="text-center mb-4">
            <i class="bi bi-search text-primary"></i>
            Rechercher un livre
        </h1>

        <!-- Barre de recherche -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="searchInput" class="form-control border-start-0"
                           placeholder="Titre, auteur, ISBN...">
                    <button class="btn btn-primary px-4" id="searchBtn">
                        Chercher
                    </button>
                </div>

                <!-- Filtres -->
                <div class="row mt-3 g-2">
                    <div class="col-md-4">
                        <select id="filtreDomaine" class="form-select">
                            <option value="">Tous les domaines</option>
                            <option value="Roman">Roman</option>
                            <option value="Science">Science</option>
                            <option value="Histoire">Histoire</option>
                            <option value="Philosophie">Philosophie</option>
                            <option value="Poésie">Poésie</option>
                            <option value="Jeunesse">Jeunesse</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="number" id="filtreAnneeMin" class="form-control"
                               placeholder="Année min" min="1000" max="2100">
                    </div>
                    <div class="col-md-3">
                        <input type="number" id="filtreAnneeMax" class="form-control"
                               placeholder="Année max" min="1000" max="2100">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-secondary w-100" id="resetBtn">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ============ RÉSULTATS ============ -->
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 id="resultatsCount" class="text-muted mb-0">
            <i class="bi bi-hourglass-split"></i> Chargement...
        </h4>
    </div>

    <!-- Grille des livres -->
    <div class="row g-4" id="livresGrid">
        <!-- Les cartes seront injectées ici par JavaScript -->
    </div>

    <!-- Message aucun résultat -->
    <div id="noResults" class="text-center py-5 d-none">
        <i class="bi bi-emoji-frown display-1 text-muted"></i>
        <p class="text-muted mt-3">Aucun livre trouvé</p>
    </div>
</div>

<!-- ============ FOOTER ============ -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        <small>© 2026 Ma Bibliothèque — Application de Recherche de Livres</small>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS perso -->
<script src="/app.js"></script>

</body>
</html>
